name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python linters
        run: python -m pip install --quiet check-jsonschema yamllint

      # The schema is pinned to the commit of tag v3.0.0-m.12: the branch moves
      # with every draft, and a schema change is a decision, not a surprise.
      - name: Validate descriptor against the v3 schema
        run: >
          check-jsonschema
          --schemafile https://raw.githubusercontent.com/docker/sandbox-kit-spec/6b0bc2504942eb9335447d5035425536d9c495d6/schema/kit.schema.json
          pi-agent.yaml

      - name: Check the Pi version is declared once
        run: |
          declared="$(python -c 'import yaml; print(yaml.safe_load(open("pi-agent.yaml"))["args"]["version"]["default"])')"
          pinned="$(sed -n 's/^ARG PI_VERSION=//p' pi-agent.dockerfile)"
          if [ "$declared" != "$pinned" ]; then
            echo "pi-agent.yaml args.version is $declared, pi-agent.dockerfile ARG is $pinned"
            exit 1
          fi

      - name: Lint YAML
        run: yamllint --strict -c .yamllint pi-agent.yaml

      - name: Lint shell
        run: shellcheck scripts/smoke.sh

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: pi-agent.dockerfile
          failure-threshold: error

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # arm64 is emulated on the amd64 runner. The image runs npm install once
      # per platform, which is also what validates the arm64 tree.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: kit-builder
          driver: docker-container

      # The `# syntax=docker/sandbox-kit:3` frontend validates the descriptor
      # during the build, so a successful build gates grammar and capability
      # shape in addition to the static checks in `lint`.
      - name: Build kit to an OCI layout
        run: |
          docker buildx build --builder kit-builder -f pi-agent.yaml \
            --platform linux/amd64,linux/arm64 \
            -t pi-agent:ci \
            --output type=oci,dest=layout,tar=false .

      - name: Show layout
        run: find layout -type f | head -40

      - name: Upload layout
        uses: actions/upload-artifact@v7
        with:
          name: kit-layout
          path: layout
          retention-days: 7
